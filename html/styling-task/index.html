<!DOCTYPE html>
<html>
<head>
  <title>About Page Style</title>

  <style>
    .about {
      text-align: center;
      padding: 30px;
    }

    .about h1 {
      text-align: center;
      font-size: 50px;
      color: black;
    }

   
    .about p {
      text-align: center;
      font-size: 19px;
      color: rgb(51, 158, 144);
    }

    
    .section {
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      border: 2px solid black;
      background-color: rgba(42, 42, 80, 0.1);
    }

    .section h1 {
      font-size: 30px;
      color: darkblue;
    }
    
    .section p{
    font-size:20px;
    color: rgb(128, 6, 97);
    }
    
  </style>
</head>

<body>

  <div class="about">
    <h1 style="color: darkred; font-style: italic;">About Us</h1>
    <p>This is my first time doing it </p>
  </div>
  <div class="section">
    <h1>Services</h1>
    <p>We build websites using HTML and CSS </p>
  </div>

</body>
</html>
